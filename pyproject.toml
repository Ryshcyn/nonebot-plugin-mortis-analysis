[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-mortis-analysis"
version = "1.3.1"
description = "小睦解析：视频与图文链接解析、平台主题长图和热门评论"
readme = "README.md"
requires-python = ">=3.10"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ryshcyn"}]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["nonebot2", "onebot", "bilibili", "douyin", "xiaohongshu"]
dependencies = [
  "nonebot2>=2.3,<3", "nonebot-adapter-onebot>=2.4,<3",
  "nonebot-plugin-localstore>=0.6,<1", "nonebot-plugin-htmlrender>=0.6,<0.7",
  "aiohttp>=3.9,<4", "httpx>=0.28,<1", "aiofiles>=23", "Pillow>=10",
  "jinja2>=3.1,<4", "markupsafe>=2.1,<4", "yarl>=1.9,<2",
  "PyExecJS>=1.5.1", "bilibili-api-python>=17.4,<18",
  "pydantic>=2,<3"
]

[project.urls]
Homepage = "https://github.com/Ryshcyn/nonebot-plugin-mortis-analysis"
Repository = "https://github.com/Ryshcyn/nonebot-plugin-mortis-analysis"
Documentation = "https://github.com/Ryshcyn/nonebot-plugin-mortis-analysis#readme"
Issues = "https://github.com/Ryshcyn/nonebot-plugin-mortis-analysis/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6", "nonebot2[fastapi]>=2.3,<3", "playwright>=1.40,<2", "tomli>=2; python_version < '3.11'"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nonebot_plugin_mortis_analysis*"]

[tool.setuptools.package-data]
nonebot_plugin_mortis_analysis = ["*.html", "core/*.js"]

[tool.nonebot]
plugins = ["nonebot_plugin_mortis_analysis"]
